<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Duvela — Duel invite</title>
<link rel="icon" href="./logo.webp" type="image/webp">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 80% 30% at 100% 100%, rgba(93, 34, 169, .45), transparent 70%),
      radial-gradient(ellipse 75% 40% at 15% -5%, rgba(95, 35, 190, .55), transparent 75%),
      #170d31;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(100%, 460px); margin: 0 auto; padding: 28px 18px 40px; display: flex; flex-direction: column; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 42px; height: 42px; border-radius: 12px; }
  .brand b { display: block; font-size: 16px; font-weight: 900; letter-spacing: -.02em; }
  .brand small { color: #d9d1ee; font-size: 10px; font-weight: 700; }
  .card {
    padding: 24px 18px 20px; border-radius: 26px; border: 1px solid #655080;
    background: linear-gradient(170deg, #352357, #281941);
    box-shadow: 0 14px 34px rgba(10, 3, 26, .3);
    display: flex; flex-direction: column; gap: 14px; text-align: center;
  }
  .swords { font-size: 44px; line-height: 1; filter: drop-shadow(0 0 14px rgba(255, 170, 38, .45)); }
  h1 { font-size: 26px; font-weight: 900; letter-spacing: -.03em; }
  .lead { color: #cfc3e6; font-size: 14px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip { padding: 7px 11px; border-radius: 999px; background: #4a336c; font-size: 12px; font-weight: 800; }
  .code-box {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
    min-height: 78px; padding: 8px 10px 8px 16px; border-radius: 16px;
    border: 1px solid #6b4e91; background: rgba(20, 10, 45, .3); text-align: left;
  }
  .overline { grid-column: 1 / -1; color: #d3c8e7; font-size: 12px; font-weight: 800; }
  .code { font-size: clamp(28px, 9vw, 38px); font-weight: 900; letter-spacing: .12em; }
  .copy {
    border: 1px solid #785da0; background: #503477; color: #fff; border-radius: 12px;
    padding: 10px 12px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 54px; border-radius: 18px; border: 1px solid #d99cfa;
    background: linear-gradient(180deg, #b047fa, #6b20cf); color: #fff;
    font-size: 16px; font-weight: 900; text-decoration: none;
    box-shadow: 0 8px 22px rgba(118, 42, 206, .35);
  }
  .btn:active, .copy:active { transform: scale(.98); }
  .hint { color: #a99bc9; font-size: 12.5px; line-height: 1.5; }
  .steps-title { color: #fff; font-size: 14px; font-weight: 800; text-align: left; margin-top: 4px; }
  .steps { list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .steps li {
    counter-increment: step; display: flex; gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .06);
    color: #e5dbfc; font-size: 13.5px; font-weight: 600;
  }
  .steps li::before {
    content: counter(step); flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; background: #8739ef; color: #fff; font-size: 12px; font-weight: 900;
  }
  .home { color: #bba8d7; font-size: 13px; font-weight: 700; text-align: center; text-decoration: none; }
  .hidden { display: none !important; }
  :focus-visible { outline: 3px solid #29e681; outline-offset: 3px; }

  .btn-ghost { background: transparent; border: 1px solid #a07bcc; box-shadow: none; color: #f7ecff; font: inherit; font-size: 15px; font-weight: 850; cursor: pointer; }
  .play { display: flex; flex-direction: column; gap: 12px; }
  .fd-card { padding: 22px 18px; border-radius: 24px; border: 1px solid #655080; background: linear-gradient(170deg, #352357, #281941); display: flex; flex-direction: column; gap: 12px; }
  .fd-center { align-items: stretch; text-align: center; }
  .fd-status { font-size: 16px; font-weight: 800; line-height: 1.45; }
  .fd-sub { color: #cfc3e6; font-size: 13.5px; }
  .fd-spinner { width: 34px; height: 34px; margin: 0 auto; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: fd-spin 1s linear infinite; }
  @keyframes fd-spin { to { transform: rotate(360deg); } }
  .fd-btn { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 16px; border: 1px solid #d99cfa; background: linear-gradient(180deg, #b047fa, #6b20cf); color: #fff; font: inherit; font-size: 15px; font-weight: 900; text-decoration: none; cursor: pointer; }
  .fd-btn-ghost { background: transparent; border-color: #a07bcc; }
  .fd-title { font-size: 24px; font-weight: 900; }
  .fd-versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .fd-player { display: grid; justify-items: center; gap: 8px; min-width: 0; }
  .fd-player b { font-size: 13px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-swords { font-size: 34px; }
  .fd-avatar { position: relative; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; border: 3px solid #b469ff; background: #7a43d8; box-shadow: 0 0 18px rgba(137,66,236,.35); font-size: 26px; font-weight: 900; }
  .fd-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .fd-crown { position: absolute; top: -18px; right: -6px; font-size: 22px; }
  .fd-count-area { min-height: 150px; display: grid; place-items: center; }
  .fd-ready { color: #d9c4ff; font-size: 20px; font-weight: 900; }
  .fd-count { width: 128px; height: 128px; border-radius: 50%; display: grid; place-items: center; border: 4px solid #d99cfa; background: linear-gradient(180deg, #b047fa, #6b20cf); font-size: 70px; font-weight: 900; box-shadow: 0 0 30px rgba(135,57,239,.6); }
  .fd-go { padding: 16px 42px; border-radius: 999px; border: 3px solid #a3ffa7; background: linear-gradient(180deg, #18d96e, #0a9e57); font-size: 42px; font-weight: 900; box-shadow: 0 0 26px rgba(13,224,99,.55); }
  .fd-pop { animation: fd-pop .42s cubic-bezier(.2,1.6,.4,1); }
  @keyframes fd-pop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .fd-board { display: grid; grid-template-columns: 1fr 74px 1fr; gap: 10px; align-items: start; }
  .fd-side { display: grid; gap: 8px; min-width: 0; }
  .fd-side-top { display: flex; align-items: center; gap: 8px; }
  .fd-right .fd-side-top { flex-direction: row-reverse; text-align: right; }
  .fd-side .fd-avatar { width: 42px; height: 42px; font-size: 15px; border-width: 2px; flex: 0 0 auto; }
  .fd-side .fd-crown { display: none; }
  .fd-side-text { display: grid; min-width: 0; }
  .fd-side-name { color: #b5a5d5; font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fd-side-score { font-size: 26px; font-weight: 900; line-height: 1.1; }
  .fd-track { height: 8px; border-radius: 999px; background: #4a385f; overflow: hidden; }
  .fd-fill { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #46e4a6, #14cfa4); transition: width .3s; }
  .fd-fill-right { margin-left: auto; background: linear-gradient(90deg, #b949ff, #d855e9); }
  .fd-timer { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: #22123d; border: 5px solid #9e3cef; border-left-color: #24eb94; box-shadow: 0 0 16px rgba(112,38,220,.45); }
  .fd-timer strong { font-size: 26px; font-weight: 900; line-height: 1; }
  .fd-timer small { color: #c7bbd9; font-size: 10px; font-weight: 800; }
  .fd-timer.is-low { border-color: #ff6b6b; border-left-color: #ffb4b4; }
  .fd-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fd-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .fd-pill { padding: 8px 12px; border-radius: 999px; background: #392754; font-size: 12.5px; font-weight: 800; }
  .fd-round { display: grid; justify-items: center; padding: 8px 14px; border-radius: 16px; background: #30204e; border: 1px solid #4d3769; }
  .fd-round small { color: #aa94cc; font-size: 10px; font-weight: 900; text-transform: uppercase; }
  .fd-round strong { font-size: 22px; font-weight: 900; }
  .fd-round.is-low { background: #5b2130; border-color: #b7507a; }
  .fd-play { display: flex; flex-direction: column; gap: 10px; }
  .fd-feedback { padding: 11px 14px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 800; }
  .fd-feedback-good { background: rgba(41,230,129,.18); border: 1px solid rgba(41,230,129,.4); }
  .fd-feedback-warning { background: rgba(250,113,128,.2); border: 1px solid rgba(250,113,128,.45); }
  .fd-question { padding: 18px; border-radius: 22px; border: 1px solid #594173; background: linear-gradient(140deg, #372359, #291941); display: grid; gap: 12px; text-align: left; }
  .fd-question span { color: #b29dcf; font-size: 12px; font-weight: 800; }
  .fd-question h2 { font-size: 22px; font-weight: 900; line-height: 1.3; }
  .fd-option { min-height: 60px; padding: 12px 20px; border-radius: 18px; border: 2px solid transparent; border-bottom: 5px solid rgba(14,2,38,.28); background: #f7f5fb; color: #1c1236; font: inherit; font-size: 18px; font-weight: 900; text-align: left; cursor: pointer; }
  .fd-option:active:not(:disabled) { transform: translateY(2px); }
  .fd-option:disabled { cursor: default; }
  .fd-option.is-correct, .fd-input.is-correct { background: #1fcb57; border-color: #a3ffa7; color: #fff; }
  .fd-option.is-wrong, .fd-input.is-wrong { background: #fa7180; border-color: #ffb6bf; color: #fff; }
  .fd-input { min-height: 58px; padding: 0 18px; border-radius: 18px; border: 2px solid transparent; background: #f7f5fb; color: #1c1236; font: inherit; font-size: 17px; font-weight: 800; }
  .fd-correct-is { color: #29e681; font-size: 14px; font-weight: 800; }
  .fd-surrender { margin-top: 6px; min-height: 46px; border-radius: 14px; border: 1px solid #b7507a; background: #291736; color: #ffaaaa; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .fd-result { gap: 16px; }
  .fd-trophy { font-size: 80px; line-height: 1; filter: drop-shadow(0 0 20px rgba(255,194,46,.5)); }
  .fd-ribbon { align-self: center; padding: 11px 24px; border-radius: 14px; background: linear-gradient(110deg, #13ad5c, #36d954); font-size: 26px; font-weight: 900; transform: rotate(-2deg); }
  .fd-ribbon.is-muted { background: linear-gradient(110deg, #7045c0, #9f60db); }
  .fd-final { font-size: 30px; font-weight: 900; white-space: nowrap; }
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <img src="./hub-app-icon.png" alt="">
    <div><b>DUVELA</b><small>Academy Hub</small></div>
  </div>

  <section class="card" id="inviteCard" aria-live="polite">
    <div class="swords" aria-hidden="true">⚔️</div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>

    <div id="inviteBody">
      <div class="chips" id="chips"></div>
    </div>

    <div class="code-box" id="codeBox">
      <span class="overline" id="codeLabel"></span>
      <strong class="code" id="code"></strong>
      <button class="copy" id="copy" type="button"></button>
    </div>

    <a class="btn" id="openApp" href="#"></a>
    <button class="btn btn-ghost" id="playWeb" type="button"></button>
    <p class="hint" id="hint"></p>

    <p class="steps-title" id="stepsTitle"></p>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="play hidden" id="playRoot" aria-live="polite"></section>

  <a class="home" id="home" href="./index.html"></a>
</main>
<script src="./web/duel-invite.js?v=20261114-friend2"></script>
</body>
</html>
