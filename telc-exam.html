<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Realistische DUVELA Prüfungssimulation im Format Start Deutsch 1 / telc Deutsch A1.">
  <title>DUVELA EXAM · Deutsch A1</title>
  <link rel="icon" href="./logo.webp" type="image/webp">
  <link rel="stylesheet" href="./web/telc-exam.css">
  <script src="./web/vendor/supabase-js-v2.js"></script>
</head>
<body>
  <header class="exam-header">
    <a class="back-link" href="./app.html?role=learner#study" aria-label="Zurück zum Lernbereich">← <span>Lernbereich</span></a>
    <div class="exam-brand" aria-label="DUVELA EXAM">
      <img src="./logo.webp" alt="">
      <span>DUVELA</span>
      <i></i>
      <strong>EXAM</strong>
    </div>
    <div class="exam-clock" id="clock" hidden aria-live="polite">
      <span id="timer-label">Prüfungszeit</span>
      <b id="timer">20:00</b>

    <span class="level-chip" id="level-chip">Deutsch · A1</span>

  <main class="exam-main" id="app" aria-live="polite"></main>

  <noscript>
    <div class="noscript">Für die Prüfungssimulation muss JavaScript aktiviert sein.</div>
  </noscript>
  <script type="module" src="./web/telc-exam.js"></script>
